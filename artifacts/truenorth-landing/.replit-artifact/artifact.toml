kind = "web"
previewPath = "/"
title = "TrueNorth — A calmer way to live"
description = "A calm, community-first landing page for TrueNorth, an early-stage space where young women can reflect honestly, connect meaningfully, and help shape what gets built next."
version = "1.0.0"
id = "artifacts/truenorth-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20758

[services.development]
run = "pnpm --filter @workspace/truenorth-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/truenorth-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/truenorth-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20758"
BASE_PATH = "/"
